syntax = "proto3";

package murouse.rate_limiter.v1;

option go_package = "github.com/murouse/rate-limiter/pkg/api/murouse/rate_limiter/v1;ratelimiterv1";

import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";

message Rule {
  // name — part of the storage key and of the exceeded-limit error; empty — derived from the rule:
  // "<limit>_per_<window>" ("2_per_1m", "10_per_1d"), "_shared" for a shared rule
  string name = 1;
  int32 limit = 2;
  google.protobuf.Duration window = 3;
  // shared — one counter for the whole method: rate_key attributes and the rate key extension are not part of the key
  // (e.g. a daily cap on all SendCode calls on top of a per-phone rule)
  bool shared = 4;
}

extend google.protobuf.MethodOptions {
  repeated Rule rules = 51234;
}

extend google.protobuf.FieldOptions {
  string rate_key = 51235;
}